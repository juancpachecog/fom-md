<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/fom-symbol.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FOM — Plataforma de control y monitoreo de flotas mediante GPS. Localiza, organiza y supervisa cada unidad desde una sola plataforma." />
    <meta name="theme-color" content="#03080D" />
    <meta property="og:title" content="FOM — Control total de tu flota" />
    <meta property="og:description" content="FOM — Plataforma de control y monitoreo de flotas mediante GPS. Localiza, organiza y supervisa cada unidad desde una sola plataforma." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_VE" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk y Plus Jakarta Sans: sitio de marketing.
         Spline Sans: la fuente que usa la app de flotas en web (su
         --font-display), para que la consola y la app se vean iguales. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Spline+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- La pantalla de carga: se pinta desde el primer cuadro, antes de React. -->
    <link rel="stylesheet" href="/carga-fom.css" />
    <title>FOM — Control total de tu flota</title>
  </head>
  <body>
    <div id="root">
      <!-- Lo reemplaza React al arrancar (src/components/CargaFom.jsx es la misma pieza). -->
      <div class="carga-fom" role="status" aria-label="FOM · Iniciando">
        <div class="carga-fom-marca" aria-hidden="true">
          <svg class="carga-fom-flechas" viewBox="0 0 104 82">
            <path d="M3 25h14a4 4 0 0 1 3.4 1.9l9.7 15a4 4 0 0 1 0 4.3l-9.7 15A4 4 0 0 1 17 63H4a3 3 0 0 1-2.5-4.7L10 45a4 4 0 0 0 0-4.3L.5 29.7A3 3 0 0 1 3 25Z" />
            <path d="M24 13h18a5 5 0 0 1 4.2 2.3l16.2 25a5 5 0 0 1 0 5.4L46.2 71A5 5 0 0 1 42 73H26a4 4 0 0 1-3.4-6.1l13.6-21a5 5 0 0 0 0-5.4l-15.6-21A4 4 0 0 1 24 13Z" />
            <path d="M50 0h24a6 6 0 0 1 5 2.7l24 36a6 6 0 0 1 0 6.6L79 79.3a6 6 0 0 1-5 2.7H53a5 5 0 0 1-4.2-7.7l20.7-29a6 6 0 0 0 0-6.6L45.8 7.7A5 5 0 0 1 50 0Z" />
          </svg>
          <div class="carga-fom-nombre"><span>F</span><span>O</span><span>M</span></div>
        </div>
        <p class="carga-fom-lema">Fleet Operations &amp; Maintenance</p>
        <div class="carga-fom-barra" aria-hidden="true"></div>
        <p class="carga-fom-estado">Iniciando…</p>
      </div>
    </div>
    <noscript>FOM requiere JavaScript para mostrar la experiencia de monitoreo de flotas.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
